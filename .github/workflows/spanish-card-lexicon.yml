name: Spanish Card Lexicon Build

on:
  push:
    branches:
      - tmp/spanish-card-data-20260725
    paths:
      - tools/build_spanish_lexicon.py
      - .github/workflows/spanish-card-lexicon.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Hunspell Spanish dictionary
        run: |
          sudo apt-get update
          sudo apt-get install -y hunspell hunspell-es
          hunspell -D 2>&1 | grep -E 'es_ES|AVAILABLE DICTIONARIES' || true
      - name: Build formal lexicons and optimize card distribution
        run: python3 tools/build_spanish_lexicon.py
      - name: Create archive
        run: |
          cd artifacts
          zip -r spanish-card-lexicon.zip spanish-card-lexicon
      - uses: actions/upload-artifact@v4
        with:
          name: spanish-card-lexicon
          path: |
            artifacts/spanish-card-lexicon/**
            artifacts/spanish-card-lexicon.zip
          if-no-files-found: error
