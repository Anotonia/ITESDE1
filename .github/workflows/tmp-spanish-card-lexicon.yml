name: Temporary Spanish Card Lexicon Build
on:
  push:
    branches: [main]
    paths:
      - tools/tmp_build_spanish_lexicon.py
      - .github/workflows/tmp-spanish-card-lexicon.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hunspell hunspell-es zip
      - name: Build lexicons and optimize distributions
        run: python3 tools/tmp_build_spanish_lexicon.py
      - name: Archive
        run: |
          cd artifacts
          zip -r spanish-card-lexicon.zip spanish-card-lexicon
      - uses: actions/upload-artifact@v4
        with:
          name: spanish-card-lexicon
          path: |
            artifacts/spanish-card-lexicon/**
            artifacts/spanish-card-lexicon.zip
          if-no-files-found: error
